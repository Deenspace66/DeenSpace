<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeenSpace - Taleem-e-Quran Academy</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container">
  <header>
    <h1>🌙 DeenSpace</h1>
    <p>Taleem-e-Quran Academy</p>
  </header>

  <div id="auth-section" class="card">
    <div class="tabs">
      <button id="loginTab" class="active" onclick="showLogin()">Login</button>
      <button id="registerTab" onclick="showRegister()">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Login</button>
      <p id="loginMessage"></p>
    </form>

    <!-- Register Form - FIXED -->
    <form id="registerForm" style="display:none;">
      <input type="text" id="registerName" placeholder="Full Name" required>
      <input type="email" id="registerEmail" placeholder="Email" required>
      <input type="password" id="registerPassword" placeholder="Password (min 6)" required>
      <input type="password" id="registerConfirm" placeholder="Confirm Password" required>
      <select id="registerRole" required>
        <option value="">Select Role</option>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="parent">Parent</option>
      </select>
      <button type="submit">Create Account</button>
      <p id="registerMessage"></p>
    </form>
  </div>

  <div id="dashboard" class="card" style="display:none;">
    <h2>Welcome <span id="userName"></span>!</h2>
    <p>Email: <span id="userEmail"></span></p>
    <p>Role: <span id="userRole"></span></p>
    <button onclick="logout()">Logout</button>
    
    <div class="courses">
      <h3>Our Courses</h3>
      <div class="course-grid">
        <div class="course">📖 Noorani Qaida</div>
        <div class="course">📘 Nazra Quran</div>
        <div class="course">📗 Hifz-e-Quran</div>
        <div class="course">📙 Tajweed</div>
      </div>
    </div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
